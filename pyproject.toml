[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netintrusion-detector"
version = "0.1.0"
description = "Network intrusion / anomaly detection on the NSL-KDD benchmark (binary and multiclass ML classifiers with a proper preprocessing pipeline and security-relevant evaluation)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Adeev" }]
keywords = ["network-intrusion-detection", "nsl-kdd", "cybersecurity", "machine-learning", "anomaly-detection"]
dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
netintrusion-detector = "netintrusion_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netintrusion_detector = ["py.typed"]
